name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    changes:
        name: Detect Changes
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        outputs:
            web: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.web }}
        steps:
            - uses: actions/checkout@v7
            - uses: dorny/paths-filter@v4
              if: github.event_name != 'workflow_dispatch'
              id: filter
              with:
                  filters: |
                      web:
                        - '.cargo/**'
                        - '.dockerignore'
                        - '.env.example'
                        - '.github/actions/**'
                        - '.github/workflows/ci.yml'
                        - '.github/workflows/release.yml'
                        - '.npmrc'
                        - '.oxfmtrc.json'
                        - '.oxlintrc.json'
                        - 'Cargo.toml'
                        - 'Cargo.lock'
                        - 'Dockerfile.web'
                        - 'LICENSE'
                        - 'LICENSES/**'
                        - 'NOTICE'
                        - 'compose*.yaml'
                        - 'crates/**'
                        - 'deploy/**'
                        - 'index.html'
                        - 'package.json'
                        - 'package-lock.json'
                        - 'public/**'
                        - 'scripts/**'
                        - 'src/**'
                        - 'src-tauri/**'
                        - 'tsconfig*.json'
                        - 'vite.config.*'
                        - 'vitest.config.*'

    frontend:
        name: Web Frontend Checks
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-node
              with:
                  node-version: 26.x
            - run: npm run format:check
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test

    rust:
        name: Web Rust Checks
        needs: changes
        if: needs.changes.outputs.web == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Install Web build dependencies
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev cmake clang
            - uses: dtolnay/rust-toolchain@1.97.0
              with:
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ci-web-rust
                  save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
            - run: cargo fmt --all -- --check
            - run: cargo clippy --locked -p vrcx-0-web --all-targets --no-deps -- -D warnings
            - run: cargo test --locked -p vrcx-0-web

    docker:
        name: Web Docker Build and Startup
        needs: changes
        if: needs.changes.outputs.web == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        env:
            DOCKER_BUILD_RECORD_UPLOAD: 'false'
            VRCX_WEB_PASSWORD: ci-compose-validation-only
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Validate deployment templates
              run: |
                  docker compose --env-file /dev/null -f compose.example.yaml config --quiet
                  docker compose --env-file /dev/null -f compose.example.yaml -f compose.build.yaml config --quiet
            - uses: docker/setup-buildx-action@v3
            - name: Build the Web image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile.web
                  platforms: linux/amd64
                  load: true
                  push: false
                  tags: vrcx-0-web:ci
                  cache-from: type=gha,scope=ci-web-amd64
                  cache-to: type=gha,scope=ci-web-amd64,mode=max
            - name: Test container startup with isolated data
              run: bash scripts/smoke-web-image.sh vrcx-0-web:ci

    ci-success:
        name: CI Success
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        if: always()
        needs: [changes, frontend, rust, docker]
        steps:
            - name: Verify all required checks completed
              env:
                  CHECKS: ${{ toJSON(needs) }}
              run: |
                  node <<'NODE'
                  const checks = JSON.parse(process.env.CHECKS);
                  const web = checks.changes.outputs.web;
                  const failures = [];
                  for (const job of ['changes', 'frontend']) {
                      if (checks[job].result !== 'success') failures.push(`${job}: ${checks[job].result}`);
                  }
                  if (web !== 'true' && web !== 'false') failures.push('Change detection did not return a valid result');
                  for (const job of ['rust', 'docker']) {
                      const expected = web === 'true' ? 'success' : 'skipped';
                      if (checks[job].result !== expected) failures.push(`${job}: ${checks[job].result} (expected ${expected})`);
                  }
                  if (failures.length) {
                      console.error(failures.join('\n'));
                      process.exit(1);
                  }
                  NODE
