name: Release

on:
    push:
        tags:
            - 'v[0-9]*.[0-9]*.[0-9]*-web.[0-9]*'

# Serialize all versions because they share the latest tag.
concurrency:
    group: release-web-image
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    metadata:
        name: Validate Web Release
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            image: ${{ steps.release.outputs.image }}
            version: ${{ steps.release.outputs.version }}
            sha_tag: ${{ steps.release.outputs.sha_tag }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: 26.x
            - name: Require a commit from master
              run: git merge-base --is-ancestor HEAD origin/master
            - name: Resolve image metadata
              id: release
              run: node scripts/web-release.ts metadata

    frontend:
        name: Web Frontend Checks
        needs: metadata
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-node
              with:
                  node-version: 26.x
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test

    backend:
        name: Web Rust Tests
        needs: metadata
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Install Web build dependencies
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev cmake clang
            - uses: dtolnay/rust-toolchain@1.97.0
            - uses: Swatinem/rust-cache@v2
              with:
                  shared-key: release-web-tests
            - run: cargo test --locked -p vrcx-0-web

    image:
        name: Publish Web Image
        needs: [metadata, frontend, backend]
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        permissions:
            contents: read
            packages: write
        env:
            IMAGE: ${{ needs.metadata.outputs.image }}
            VERSION: ${{ needs.metadata.outputs.version }}
            SHA_TAG: ${{ needs.metadata.outputs.sha_tag }}
            DOCKER_BUILD_RECORD_UPLOAD: 'false'
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: 26.x
            - name: Refuse to overwrite a published version
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/web-release.ts check-unpublished
            - uses: docker/setup-buildx-action@v3
            - name: Build the release image locally
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile.web
                  platforms: linux/amd64
                  load: true
                  push: false
                  tags: ${{ env.IMAGE }}:${{ env.VERSION }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.version=${{ env.VERSION }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.licenses=GPL-3.0-only
                  cache-from: type=gha,scope=release-web-amd64
                  cache-to: type=gha,scope=release-web-amd64,mode=max
            - name: Test container startup with Compose
              run: bash scripts/smoke-web-image.sh "$IMAGE:$VERSION"
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            - name: Recheck the version before publishing
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/web-release.ts check-unpublished
            - name: Push the tested image, updating latest last
              run: |
                  set -euo pipefail
                  docker push "$IMAGE:$VERSION"
                  docker tag "$IMAGE:$VERSION" "$IMAGE:$SHA_TAG"
                  docker push "$IMAGE:$SHA_TAG"
                  docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
                  docker push "$IMAGE:latest"
                  {
                      echo "Published $IMAGE:$VERSION (linux/amd64)"
                      echo
                      echo "Commit tag: $IMAGE:$SHA_TAG"
                      echo "Latest: $IMAGE:latest"
                      echo
                      echo 'For the first release, set the GHCR package visibility to Public and verify an anonymous pull.'
                  } >> "$GITHUB_STEP_SUMMARY"
