name: Setup Node
description: Set up the repository Node.js toolchain and install locked dependencies.

inputs:
    node-version:
        description: Node.js version to install.
        default: 24.x

runs:
    using: composite
    steps:
        - uses: actions/setup-node@v6
          with:
              node-version: ${{ inputs.node-version }}
              cache: npm
        - run: npm ci
          shell: bash
