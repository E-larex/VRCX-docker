[package]
name = "vrcx-0-application-activity"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Activity delivery runtime"

[features]
test-utils = ["vrcx-0-application-core/test-utils"]

[dependencies]
chrono = { workspace = true }
minijinja = { version = "3.0", default-features = false, features = ["builtins", "json", "serde", "fuel", "macros", "multi_template", "std_collections"] }
moka = { version = "0.12", features = ["sync"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "rt"] }
url = { workspace = true }
vrcx-0-application-core = { path = "../application-core" }
vrcx-0-core = { path = "../core" }
vrcx-0-contracts = { path = "../contracts" }
vrcx-0-i18n = { path = "../i18n" }

[dev-dependencies]
vrcx-0-application-core = { path = "../application-core", features = ["test-utils"] }
